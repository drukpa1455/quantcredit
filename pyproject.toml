[project]
name = "quantcredit"
version = "0.1.0"
description = "Executable consumer-credit research from public records to graph models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1,<4",
    "pandas>=3.0.5,<4",
    "scikit-learn>=1.9,<2",
    "seaborn>=0.13.2,<0.14",
    "tinygrad @ git+https://github.com/tinygrad/tinygrad.git@33755a34657d25920914badbe32a9d70489669c7",
    "tinymesh @ git+https://github.com/spatioterra-ai/tinymesh.git@d8897db013041c56fce821aa30cd3e551debb8e6",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
notebook = ["ipykernel>=7.2,<8"]
lint = [
    "mypy>=1.19,<2",
    "ruff>=0.15,<0.16",
    "scikit-learn-stubs>=0.0.3",
    "types-seaborn>=0.13.2",
]

[tool.mypy]
files = ["src/quantcredit"]
strict = true

[tool.ruff]
indent-width = 2
line-length = 100
target-version = "py312"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
